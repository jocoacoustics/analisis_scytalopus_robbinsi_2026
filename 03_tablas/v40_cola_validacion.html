const hr=document.createElement('tr');config.columns.forEach((c,idx)=>{const th=document.createElement('th');th.innerHTML=`<div class="head-row"><button class="sort-btn">${c.label}</button><span class="sort-indicator">⇅</span></div><input class="column-filter" placeholder="Filtrar…"><span class="resize-handle"></span>`;

function rows(){const q=(search.value||'').toLowerCase();let a=data.filter(r=>config.columns.every(c=>!filters[c.key]||fmt(c,r[c.key]).toLowerCase().includes(filters[c.key]))&&(!q||config.columns.some(c=>fmt(c,r[c.key]).toLowerCase().includes(q))));if(sortKey){const c=config.columns.find(x=>x.key===sortKey);a.sort((x,y)=>c.numeric?sortDir*(Number(x[sortKey])-Number(y[sortKey])):sortDir*raw(x[sortKey]).localeCompare(raw(y[sortKey]),'es',{numeric:true}))}return a}
