<script>

  const MAP=map_16708288f9c35c8a05eb53b136a3b8a3;
  const labels=Array.from(document.querySelectorAll('.leaflet-control-layers-overlays label'));
  const sep=labels.find(el=>el.querySelector('.layer-separator-row'));
  if(sep){
    const input=sep.querySelector('input'); if(input) input.style.display='none';
    sep.style.pointerEvents='none'; sep.style.margin='0'; sep.style.padding='0'; sep.style.height='12px';
  }
  const zoomBox=document.querySelector('.leaflet-control-zoom');
  if(zoomBox && !zoomBox.querySelector('.zoom-fullscreen')){
    const fs=document.createElement('a');
    fs.className='zoom-fullscreen';fs.href='#';fs.title='Pantalla completa';fs.setAttribute('aria-label','Pantalla completa');fs.innerHTML='⛶';
    zoomBox.appendChild(fs);
    L.DomEvent.on(fs,'click',e=>{
      L.DomEvent.preventDefault(e);L.DomEvent.stopPropagation(e);
      const el=MAP.getContainer();
      if(!document.fullscreenElement) el.requestFullscreen?.(); else document.exitFullscreen?.();
    });
    document.addEventListener('fullscreenchange',()=>setTimeout(()=>MAP.invalidateSize(),120));
  }
})();
</script>

<!-- JOCOTOCO_CAMPAIGN_MASTER_AFTER_FOLIUM_INIT -->

<script>
(function(){
  const MAP=map_16708288f9c35c8a05eb53b136a3b8a3;
  function installCampaignMasterCheckbox(){
    const overlaysBox=document.querySelector('.leaflet-control-layers-overlays');
    if(!overlaysBox || overlaysBox.querySelector('.campaign-master-row')) return;
    const row=document.createElement('label');
    row.className='campaign-master-row';
    row.style.fontWeight='700';row.style.paddingBottom='4px';row.style.marginBottom='4px';row.style.borderBottom='1px solid #e1e5e2';
    row.innerHTML=`<span><input type="checkbox" class="campaign-master-checkbox"><span class="legend-symbol" style="color:#252A28;font-size:14px">●</span><b>Todas las campañas</b></span>`;
    overlaysBox.insertBefore(row,overlaysBox.firstChild);
    const master=row.querySelector('.campaign-master-checkbox');
    let batchChanging=false;
    function campaignInputs(){
      return Array.from(overlaysBox.querySelectorAll('label:not(.campaign-master-row)'))
        .filter(el=>(el.textContent||'').includes('Campaña · '))
        .map(el=>el.querySelector('input[type="checkbox"]')).filter(Boolean);
    }
    function syncMaster(){
      if(batchChanging) return;
      const inputs=campaignInputs(); if(!inputs.length) return;
      const n=inputs.filter(i=>i.checked).length;
      master.checked=n===inputs.length;
      master.indeterminate=n>0 && n<inputs.length;
    }
    function setAllCampaigns(target){
      const inputs=campaignInputs(); batchChanging=true;
      inputs.forEach(input=>{if(input.checked!==target) input.click();});
      batchChanging=false; syncMaster();
    }
    master.onchange=function(){setAllCampaigns(this.checked);};
    MAP.on('overlayadd overlayremove',()=>setTimeout(syncMaster,0));
    campaignInputs().forEach(input=>input.addEventListener('change',()=>setTimeout(syncMaster,0)));
    syncMaster();
  }
  setTimeout(installCampaignMasterCheckbox,0);
})();
</script>
