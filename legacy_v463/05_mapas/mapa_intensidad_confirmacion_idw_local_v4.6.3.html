<script>
(function(){
  const MAP=map_835b01ca93e34dc12f1608580a7fd333;
  const labels=Array.from(document.querySelectorAll('.leaflet-control-layers-overlays label'));
  const sep=labels.find(el=>el.querySelector('.layer-separator-row'));
  if(sep){
    const input=sep.querySelector('input'); if(input) input.style.display='none';
    sep.style.pointerEvents='none'; sep.style.margin='0'; sep.style.padding='0'; sep.style.height='12px';
  }
  const zoomBox=document.querySelector('.leaflet-control-zoom');
  if(zoomBox && !zoomBox.querySelector('.zoom-fullscreen')){
    const fs=document.createElement('a');
    fs.className='zoom-fullscreen';fs.href='#';fs.title='Pantalla completa';fs.setAttribute('aria-label','Pantalla completa');fs.innerHTML='⛶';
    zoomBox.appendChild(fs);
    L.DomEvent.on(fs,'click',e=>{
      L.DomEvent.preventDefault(e);L.DomEvent.stopPropagation(e);
      const el=MAP.getContainer();
      if(!document.fullscreenElement) el.requestFullscreen?.(); else document.exitFullscreen?.();
    });
    document.addEventListener('fullscreenchange',()=>setTimeout(()=>MAP.invalidateSize(),120));
  }
})();
</script>
