const ColorbarControl=L.Control.extend({options:{position:'bottomright'},onAdd:function(){const c=L.DomUtil.create('div','colorbar-control');c.innerHTML=`<div class="colorbar-head"><span class="cb-title"></span><span class="arr">▼</span></div><div class="colorbar-body"><div class="colorbar-gradient"></div><div class="colorbar-ticks"><span>${pct(DATA.scale.low)}</span><span>${pct(DATA.scale.low+.25*(DATA.scale.high-DATA.scale.low))}</span><span>${pct(DATA.scale.low+.50*(DATA.scale.high-DATA.scale.low))}</span><span>${pct(DATA.scale.low+.75*(DATA.scale.high-DATA.scale.low))}</span><span>${pct(DATA.scale.high)}</span></div><div class="colorbar-note"><b>Escala visual común:</b> P05–P95 de sospecha del ganador; extremos saturan.<br><span class="cb-method"></span><br>Probabilidad real en los popups; fuera del soporte = transparente.</div></div>`;L.DomEvent.disableClickPropagation(c);L.DomEvent.disableScrollPropagation(c);const head=c.querySelector('.colorbar-head'),arr=c.querySelector('.arr');let dragged=false;head.addEventListener('click',()=>{if(dragged){dragged=false;return}c.classList.toggle('collapsed');arr.textContent=c.classList.contains('collapsed')?'▲':'▼'});head.addEventListener('mousedown',ev=>{if(ev.button!==0)return;ev.preventDefault();dragged=false;const mapRect=document.getElementById('map').getBoundingClientRect(),rect=c.getBoundingClientRect(),sx=ev.clientX,sy=ev.clientY;c.style.position='fixed';c.style.left=rect.left+'px';c.style.top=rect.top+'px';c.style.right='auto';c.style.bottom='auto';c.style.margin='0';c.style.zIndex='10000';function move(e){const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>2||Math.abs(dy)>2)dragged=true;const left=Math.min(Math.max(mapRect.left,rect.left+dx),mapRect.right-c.offsetWidth),top=Math.min(Math.max(mapRect.top,rect.top+dy),mapRect.bottom-c.offsetHeight);c.style.left=left+'px';c.style.top=top+'px'}function up(){document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)}document.addEventListener('mousemove',move);document.addEventListener('mouseup',up)});return c}});
