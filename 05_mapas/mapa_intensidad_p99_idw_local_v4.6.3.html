html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif}
.leaflet-container{height:100%!important;width:100%!important}
.leaflet-control-layers{border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.18);font-size:13px}
.leaflet-control-layers-expanded{min-width:290px;padding:9px 10px 8px}
.leaflet-control-layers label{margin:2px 0;line-height:1.28}
.base-icon{display:inline-block;width:20px;text-align:center;margin-right:6px;font-size:15px;vertical-align:-1px}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 7px 0 3px;vertical-align:middle;border:1px solid rgba(0,0,0,.38)}
.legend-line{display:inline-block;width:22px;height:0;margin:0 7px 2px 2px;vertical-align:middle;border-top:3px solid}
.legend-symbol{display:inline-block;width:18px;text-align:center;margin-right:4px;font-weight:900;font-size:16px;vertical-align:-1px}
.legend-unvalidated{display:inline-block;width:13px;height:13px;margin:0 7px 0 3px;vertical-align:-2px;border:3px solid #6F7773;background:transparent;box-sizing:border-box}
.legend-gradient-mini{display:inline-block;width:42px;height:9px;margin:0 7px 0 2px;border-radius:2px;vertical-align:middle;border:1px solid rgba(0,0,0,.25)}
.layer-separator-row{display:block;height:0;border-top:1px solid #dfe4e0;margin:6px 0 5px}
.leaflet-control-zoom .zoom-fullscreen{font-size:19px!important;line-height:30px!important;border-top:1px solid #ccc}
.point-label{font-size:11px;font-weight:800;color:#111;white-space:nowrap;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 3px #fff}
.popup-title{font-size:14px;font-weight:800;color:#252A28;margin-bottom:5px}
.popup-grid{display:grid;grid-template-columns:auto auto;gap:3px 10px;font-size:11px;line-height:1.25}
.popup-grid .k{color:#66706B}.popup-grid .v{font-weight:700;color:#252A28}
.popup-state{margin-top:7px;padding-top:6px;border-top:1px solid #e1e5e2;font-size:11px}
.surface-group-title{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#66706B;margin:2px 0 3px}
.surface-radio-row{display:flex;align-items:center;gap:5px;margin:2px 0;cursor:pointer}
.surface-radio-row input{margin:0 2px 0 0}
.surface-master{font-weight:800;padding-bottom:4px;margin-bottom:3px;border-bottom:1px solid #e5e8e6}
.colorbar-control{background:rgba(255,255,255,.96);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.18);overflow:hidden;min-width:255px}
.colorbar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 9px;font-size:12px;font-weight:800;cursor:move;color:#252A28;user-select:none}
.colorbar-body{padding:0 9px 9px}.colorbar-gradient{height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.22)}
.colorbar-ticks{display:flex;justify-content:space-between;font-size:10px;color:#505853;margin-top:3px}
.colorbar-note{margin-top:5px;font-size:10px;color:#66706B;line-height:1.25}
.colorbar-control.collapsed .colorbar-body{display:none}.colorbar-control.collapsed{min-width:auto}
