:root{--green:#5F611E;--line:#d8ddc8;--text:#252A28;--muted:#66706B;--row:#F3F5EA;--badge:#E9EED7}
*{box-sizing:border-box}html,body{height:auto;margin:0;overflow:hidden;font-family:Roboto,Arial,sans-serif;color:var(--text);background:white}
.wrap{height:auto;display:grid;grid-template-rows:auto auto auto auto;align-content:start;gap:8px;padding:8px}
h3{margin:0;color:var(--green);font-size:17px;line-height:1.2}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input{min-width:220px;flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:7px}
.toolbar select,.toolbar button,.pager button{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--text)}
.table-scroll{width:100%;max-width:100%;overflow-x:scroll;overflow-y:scroll;border:1px solid var(--line);border-radius:8px;touch-action:auto;scrollbar-gutter:stable both-edges;min-height:0}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:max-content;font-size:12px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);border-right:1px solid #e7eadc;white-space:nowrap;line-height:1.2}
th{position:sticky;top:0;background:var(--green);color:white;z-index:3;min-width:105px;vertical-align:top}
tbody tr:nth-child(even) td{background:var(--row)}tbody tr:nth-child(odd) td{background:white}
.head-row{display:flex;align-items:center;gap:4px}.sort-btn{border:0;background:transparent;color:white;font-weight:800;text-align:left;cursor:pointer;white-space:normal}.sort-indicator{color:#E5ECC9}
.column-filter{width:100%;margin-top:4px;padding:3px 5px;border:1px solid #bcc6a4;border-radius:5px;font-size:11px}
.resize-handle{position:absolute;right:-3px;top:0;width:7px;height:100%;cursor:col-resize}
td.wrap-cell{white-space:normal;min-width:280px;max-width:390px}.action-badge{display:inline-block;padding:3px 7px;border-radius:999px;background:var(--badge);color:#485315;font-weight:700;line-height:1.2}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:8px}.page-info{color:var(--muted);font-size:12px}
@media(max-width:620px){.toolbar input{min-width:100%}table{font-size:11px}td.wrap-cell{min-width:250px;max-width:320px}}

function rows(){const q=(search.value||'').toLowerCase();let a=data.filter(r=>config.columns.every(c=>!filters[c.key]||fmt(c,r[c.key]).toLowerCase().includes(filters[c.key]))&&(!q||config.columns.some(c=>fmt(c,r[c.key]).toLowerCase().includes(q))));if(sortKey){const c=config.columns.find(x=>x.key===sortKey);a.sort((x,y)=>c.numeric?sortDir*(Number(x[sortKey])-Number(y[sortKey])):sortDir*raw(x[sortKey]).localeCompare(raw(y[sortKey]),'es',{numeric:true}))}return a}
function setColWidth(idx,w){const px=Math.round(w)+'px';const th=thead.querySelectorAll('th')[idx];if(th){th.style.width=px;th.style.minWidth=px;th.style.maxWidth=px}tbody.querySelectorAll('tr').forEach(tr=>{const td=tr.children[idx];if(td){td.style.width=px;td.style.minWidth=px;td.style.maxWidth=px}})}
function fitWide(){const out=[];[...thead.querySelectorAll('th')].forEach((th,idx)=>{let w=Math.max(105,th.querySelector('.sort-btn').scrollWidth+38);tbody.querySelectorAll('tr').forEach(tr=>{const td=tr.children[idx];if(td)w=Math.max(w,Math.min(config.columns[idx].wrap?390:300,td.scrollWidth+20))});if(config.columns[idx].wrap)w=Math.max(280,Math.min(w,390));else w=Math.min(w,300);out.push(w);setColWidth(idx,w)});wideWidths=out}
function fitCompact(){[...thead.querySelectorAll('th')].forEach((th,idx)=>{let w=config.columns[idx].wrap?220:Math.max(90,Math.min(170,th.querySelector('.sort-btn').scrollWidth+28));setColWidth(idx,w)})}
function notifyParent(){requestAnimationFrame(()=>{const h=Math.ceil(root.getBoundingClientRect().height+2);window.parent.postMessage({type:'jocotoco-table-height',tableId:TABLE_ID,height:h},'*')})}
function syncTableViewport(){const sc=root.querySelector('.table-scroll');if(pageSize===10){if(defaultViewportHeight===null&&!compactMode){const hHead=thead.getBoundingClientRect().height;const hRows=[...tbody.querySelectorAll('tr')].reduce((a,tr)=>a+tr.getBoundingClientRect().height,0);defaultViewportHeight=Math.max(260,Math.ceil(hHead+hRows+24))}sc.style.height=defaultViewportHeight+'px'}else{const ph=(window.parent&&window.parent.innerHeight)?window.parent.innerHeight:720;sc.style.height=Math.max(380,Math.min(650,ph-170))+'px'}sc.style.overflowX='scroll';sc.style.overflowY='scroll';notifyParent()}
function toggleFit(){if(!compactMode){if(!wideWidths)fitWide();fitCompact();compactMode=true}else{(wideWidths||[]).forEach((w,idx)=>setColWidth(idx,w));compactMode=false}requestAnimationFrame(syncTableViewport)}
function render(){const a=rows(),pages=Math.max(1,Math.ceil(a.length/pageSize));page=Math.min(page,pages);tbody.innerHTML='';a.slice((page-1)*pageSize,page*pageSize).forEach(r=>{const tr=document.createElement('tr');config.columns.forEach(c=>{const td=document.createElement('td');const val=fmt(c,r[c.key]);if(c.wrap){td.className='wrap-cell';const sp=document.createElement('span');sp.className='action-badge';sp.textContent=val;td.appendChild(sp)}else td.textContent=val;tr.appendChild(td)});tbody.appendChild(tr)});const shown=Math.max(0,Math.min(pageSize,a.length-(page-1)*pageSize));root.querySelector('.page-info').textContent=`Página ${page} de ${pages} · ${a.length} filas · mostrando ${shown}`;root.querySelector('.prev').disabled=page<=1;root.querySelector('.next').disabled=page>=pages;if(!compactMode)fitWide();else fitCompact();requestAnimationFrame(syncTableViewport)}
root.querySelector('.auto-fit').onclick=toggleFit;search.oninput=()=>{page=1;render()};pageSelect.onchange=()=>{pageSize=+pageSelect.value;page=1;defaultViewportHeight=null;render()};root.querySelector('.prev').onclick=()=>{page--;render()};root.querySelector('.next').onclick=()=>{page++;render()};render();if('ResizeObserver' in window)new ResizeObserver(()=>notifyParent()).observe(root);window.addEventListener('load',()=>{syncTableViewport();notifyParent()});
</script></body></html>
